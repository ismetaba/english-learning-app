# The Spanish track's API: the same admin app, deployed separately with a
# database that holds only the Spanish content (scripts/es/build-content.ts).
# English stays on english-learning-admin (fly.toml); the iOS app sends
# Spanish-mode requests here.
#
#   fly deploy -c fly.es.toml
#
# The machine stops when idle and starts on the next request (a few
# seconds), so an unused track costs little more than its volume.
app = "english-learning-es"
primary_region = "ams"

[build]

[env]
  DATABASE_PATH = "/data/admin.db"
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "data"
  destination = "/data"
