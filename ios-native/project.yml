name: EnglishLearning
options:
  bundleIdPrefix: com.ismetaba
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Single source of truth for the shipped version — the committed
    # .xcodeproj is regenerated from this file (`xcodegen generate`).
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: "HJ9ZP4QLTL"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    GENERATE_INFOPLIST_FILE: "YES"

targets:
  EnglishLearning:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EnglishLearning
        excludes:
          - "**/*.md"
    scheme:
      testTargets:
        - EnglishLearningTests
    resources:
      - path: EnglishLearning/Resources
    info:
      path: EnglishLearning/Resources/Info.plist
      properties:
        CFBundleDisplayName: English Learning
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismetaba.englishlearning.native
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "English Learning"
        INFOPLIST_KEY_UIStatusBarStyle: "UIStatusBarStyleLightContent"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  EnglishLearningTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EnglishLearningTests
        excludes:
          - "Core/Fixtures/**"
    dependencies:
      - target: EnglishLearning
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismetaba.englishlearning.native.tests
        GENERATE_INFOPLIST_FILE: "YES"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
